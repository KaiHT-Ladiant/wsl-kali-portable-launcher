name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --windowed --name KaliLauncher `
            --icon=kali_icon.ico `
            --add-data "kali_icon.ico;." `
            --add-data "kali_icon.png;." `
            --version-file=version_info.txt `
            --clean kali_launcher.py
          copy kali_icon.ico dist\
          copy kali_icon.png dist\

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KaliLauncher.exe
            dist/kali_icon.ico
            dist/kali_icon.png
          generate_release_notes: true
          body: |
            Maintained by **Kai_HT** ([@KaiHT-Ladiant](https://github.com/KaiHT-Ladiant)).

            - [README](https://github.com/KaiHT-Ladiant/wsl-kali-portable-launcher#readme)
            - [Contributors](https://github.com/KaiHT-Ladiant/wsl-kali-portable-launcher/blob/main/CONTRIBUTORS.md)

            Place `KaliLauncher.exe` next to your portable `kali-portable\ext4.vhdx` (or under `0.Kali`).
